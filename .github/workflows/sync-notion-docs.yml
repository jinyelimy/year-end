name: Sync Notion Docs

on:
  push:
    paths:
      - "docs/**/*.md"
      - "scripts/sync-docs-to-notion.mjs"
      - "package.json"
      - ".github/workflows/sync-notion-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-notion-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_SOURCE_PATH_PROPERTY: Source Path
      NOTION_SYNC_DOCS_DIR: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate required secrets
        run: |
          test -n "$NOTION_TOKEN"
          test -n "$NOTION_DATABASE_ID"

      - name: Detect changed docs
        id: changed-docs
        run: |
          before_sha="${{ github.event.before }}"
          if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            changed_docs=$(git ls-files 'docs/**/*.md')
          else
            changed_docs=$(git diff --name-only "$before_sha" "${{ github.sha }}" -- 'docs/**/*.md')
          fi

          {
            echo 'files<<EOF'
            echo "$changed_docs"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Skip when no docs changed
        if: ${{ steps.changed-docs.outputs.files == '' }}
        run: echo "No docs changed in this push."

      - name: Sync docs to Notion
        if: ${{ steps.changed-docs.outputs.files != '' }}
        env:
          NOTION_SYNC_FILES: ${{ steps.changed-docs.outputs.files }}
        run: npm run notion:sync
