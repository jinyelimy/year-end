<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>부양정보 입력</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4b91e2",
            "background-light": "#f6f7f8"
          },
          fontFamily: {
            display: ["Inter", "Noto Sans KR", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-background-light font-display text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <a class="flex items-center gap-3 text-primary" href="/index.html">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary/10">
          <span class="material-symbols-outlined">family_history</span>
        </div>
        <span class="text-lg font-bold tracking-tight text-slate-900">Easy-Tax</span>
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 gap-8 lg:grid-cols-12">
      <aside class="lg:col-span-4">
        <div class="sticky top-24 space-y-6">
          <div class="rounded-[28px] border border-slate-200 bg-white p-6 shadow-sm">
            <div class="mb-7 flex items-center gap-4">
              <div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary text-lg font-bold text-white" id="dependent-page-avatar">YL</div>
              <div>
                <h1 class="text-lg font-bold leading-tight text-slate-900" id="dependent-page-user-name">사용자님</h1>
                <p class="mt-1 text-sm font-medium text-slate-500" id="dependent-page-status">1단계 진행 중</p>
              </div>
            </div>

            <nav class="space-y-2">
              <a class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 transition-colors hover:bg-slate-50" href="/basic-info.html">
                <span class="material-symbols-outlined text-[1.9rem]">person</span>
                <span class="text-sm font-semibold">기본정보</span>
              </a>
              <a class="flex items-center gap-3 rounded-xl bg-primary/10 px-4 py-3 text-primary transition-colors hover:bg-primary/10" href="/dependents.html">
                <span class="material-symbols-outlined text-[1.9rem]">group</span>
                <span class="text-sm font-semibold">부양정보</span>
              </a>
            </nav>
          </div>

          <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
            <div class="flex items-center justify-between border-b border-slate-100 px-4 py-4">
              <h2 class="font-bold text-slate-900">등록된 부양가족</h2>
              <div class="flex items-center gap-2">
                <span class="rounded-full bg-slate-100 px-2 py-1 text-xs font-bold text-slate-500" id="dependent-count">총 0명</span>
                <button class="rounded-xl bg-primary px-4 py-2 text-xs font-bold text-white shadow-sm shadow-primary/20 transition-all hover:bg-primary/90" id="new-dependent-button" type="button">새로 추가</button>
              </div>
            </div>
            <div class="divide-y divide-slate-100" id="dependent-list">
              <div class="p-6 text-sm text-slate-500">로딩 중입니다...</div>
            </div>
          </div>
        </div>
      </aside>

      <section class="lg:col-span-8">
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
          <div class="mb-8 flex items-start justify-between gap-4">
            <div>
              <h2 class="text-2xl font-bold text-slate-900" id="dependent-form-title">부양가족 추가</h2>
              <p class="mt-2 text-sm text-slate-500">
                기본정보 다음 단계입니다. 입력이 끝나면 아래의 `1단계 확정` 버튼으로 완료 처리합니다.
              </p>
            </div>
            <button class="rounded-xl border border-red-200 bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-500 opacity-50 transition-all" disabled id="delete-dependent-button" type="button">
              <span class="material-symbols-outlined text-lg">delete</span>
              삭제
            </button>
          </div>

          <div class="mb-4 hidden rounded-lg border px-4 py-3 text-sm" id="dependent-message"></div>

          <form class="space-y-6" id="dependent-form">
            <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
              <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700" for="dependent-name">이름</label>
                <input class="w-full rounded-lg border border-slate-200 px-4 py-2.5 outline-none transition-all focus:border-transparent focus:ring-2 focus:ring-primary" id="dependent-name" type="text">
              </div>
              <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700" for="dependent-relation">관계</label>
                <select class="w-full rounded-lg border border-slate-200 px-4 py-2.5 outline-none transition-all focus:border-transparent focus:ring-2 focus:ring-primary" id="dependent-relation">
                  <option value="SELF">본인</option>
                  <option value="SPOUSE">배우자</option>
                  <option value="CHILD">자녀</option>
                  <option value="PARENT">부모</option>
                </select>
              </div>
              <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700" for="dependent-birth-date">생년월일</label>
                <input class="w-full rounded-lg border border-slate-200 px-4 py-2.5 outline-none transition-all focus:border-transparent focus:ring-2 focus:ring-primary" id="dependent-birth-date" type="date">
              </div>
              <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700" for="dependent-income">연간 소득</label>
                <input class="w-full rounded-lg border border-slate-200 px-4 py-2.5 outline-none transition-all focus:border-transparent focus:ring-2 focus:ring-primary" id="dependent-income" min="0" step="1" type="number" value="0">
              </div>
            </div>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700" for="dependent-resident-type">거주 구분</label>
                <select class="w-full rounded-lg border border-slate-200 px-4 py-2.5 outline-none transition-all focus:border-transparent focus:ring-2 focus:ring-primary" id="dependent-resident-type">
                  <option value="RESIDENT">거주자</option>
                  <option value="NON_RESIDENT">비거주자</option>
                </select>
              </div>
              <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700">공제 조건</label>
                <div class="grid grid-cols-1 gap-3 pt-2">
                  <label class="flex cursor-pointer items-center gap-2">
                    <input checked class="h-4 w-4 text-primary focus:ring-primary" id="dependent-lives-together" type="checkbox">
                    <span class="text-sm text-slate-600">동거 중</span>
                  </label>
                  <label class="flex cursor-pointer items-center gap-2">
                    <input class="h-4 w-4 text-primary focus:ring-primary" id="dependent-disabled" type="checkbox">
                    <span class="text-sm text-slate-600">장애인 대상</span>
                  </label>
                  <label class="flex cursor-pointer items-center gap-2">
                    <input checked class="h-4 w-4 text-primary focus:ring-primary" id="dependent-basic-deduction" type="checkbox">
                    <span class="text-sm text-slate-600">기본공제 대상</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="rounded-xl border border-primary/20 bg-primary/5 p-4">
              <h3 class="text-sm font-bold text-primary">1단계 완료 기준</h3>
              <p class="mt-2 text-sm text-slate-600">
                부양가족을 입력하거나 수정해도 자동으로 완료되지는 않습니다.
                마지막에 `1단계 확정` 버튼을 눌러야 대시보드에서 1단계 완료로 표시됩니다.
              </p>
            </div>

            <div class="flex items-center justify-between border-t border-slate-100 pt-6">
              <button class="rounded-xl border border-slate-200 bg-white px-6 py-2.5 text-sm font-semibold text-slate-600 transition-all hover:border-slate-300 hover:bg-slate-50 hover:text-slate-900" id="reset-dependent-button" type="button">대시보드</button>
              <div class="flex gap-4">
                <button class="rounded-xl border border-slate-200 bg-white px-6 py-2.5 text-sm font-semibold text-slate-700 transition-all hover:border-slate-300 hover:bg-slate-50" id="dependent-save-button" type="submit">저장</button>
                <button class="rounded-xl border border-primary bg-white px-6 py-2.5 text-sm font-semibold text-primary transition-all hover:bg-primary hover:text-white" id="confirm-step-button" type="button">1단계 확정</button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const dependentList = document.getElementById("dependent-list");
    const dependentCount = document.getElementById("dependent-count");
    const dependentFormTitle = document.getElementById("dependent-form-title");
    const dependentMessage = document.getElementById("dependent-message");
    const dependentForm = document.getElementById("dependent-form");
    const newDependentButton = document.getElementById("new-dependent-button");
    const deleteDependentButton = document.getElementById("delete-dependent-button");
    const resetDependentButton = document.getElementById("reset-dependent-button");
    const confirmStepButton = document.getElementById("confirm-step-button");
    const dependentSaveButton = document.getElementById("dependent-save-button");
    const pageAvatar = document.getElementById("dependent-page-avatar");
    const pageUserName = document.getElementById("dependent-page-user-name");
    const pageStatus = document.getElementById("dependent-page-status");
    const dependentNameInput = document.getElementById("dependent-name");
    const dependentRelationInput = document.getElementById("dependent-relation");
    const dependentBirthDateInput = document.getElementById("dependent-birth-date");
    const dependentIncomeInput = document.getElementById("dependent-income");
    const dependentResidentTypeInput = document.getElementById("dependent-resident-type");
    const dependentLivesTogetherInput = document.getElementById("dependent-lives-together");
    const dependentDisabledInput = document.getElementById("dependent-disabled");
    const dependentBasicDeductionInput = document.getElementById("dependent-basic-deduction");
    const dependentFields = [
      dependentNameInput,
      dependentRelationInput,
      dependentBirthDateInput,
      dependentIncomeInput,
      dependentResidentTypeInput,
      dependentLivesTogetherInput,
      dependentDisabledInput,
      dependentBasicDeductionInput
    ];

    let currentSessionId = null;
    let currentSession = null;
    let dependents = [];
    let selectedDependentId = null;

    function showDependentMessage(type, message) {
      dependentMessage.className = "mb-4 rounded-lg border px-4 py-3 text-sm";
      dependentMessage.classList.add(
        type === "success" ? "border-emerald-200" : "border-red-200",
        type === "success" ? "bg-emerald-50" : "bg-red-50",
        type === "success" ? "text-emerald-700" : "text-red-700"
      );
      dependentMessage.textContent = message;
      dependentMessage.classList.remove("hidden");
    }

    function isStepConfirmed() {
      return window.YearEndApp.hasDependentsConfirmed(currentSession);
    }

    function setDependentEditingLocked(locked) {
      dependentFields.forEach(function (field) {
        field.disabled = locked;
      });
      newDependentButton.disabled = locked;
      newDependentButton.classList.toggle("hidden", locked);
      newDependentButton.classList.toggle("opacity-50", locked);
      newDependentButton.classList.toggle("cursor-not-allowed", locked);
      dependentSaveButton.disabled = locked;
      dependentSaveButton.classList.toggle("hidden", locked);
      deleteDependentButton.classList.toggle("hidden", locked);
    }

    function updateStepStatus() {
      const confirmed = isStepConfirmed();
      pageStatus.textContent = confirmed ? "1단계 완료" : "1단계 진행 중";
      confirmStepButton.textContent = confirmed ? "1단계 확정 풀기" : "1단계 확정";
      confirmStepButton.classList.toggle("bg-primary", confirmed);
      confirmStepButton.classList.toggle("text-white", confirmed);
      confirmStepButton.classList.toggle("border-primary", !confirmed);
      confirmStepButton.classList.toggle("bg-white", !confirmed);
      confirmStepButton.classList.toggle("text-primary", !confirmed);
      setDependentEditingLocked(confirmed);
      updateDeleteButtonState(!!selectedDependentId);
    }

    function updateDeleteButtonState(enabled) {
      const canDelete = enabled && !isStepConfirmed();
      deleteDependentButton.disabled = !canDelete;
      deleteDependentButton.classList.toggle("opacity-50", !canDelete);
      deleteDependentButton.classList.toggle("cursor-not-allowed", !canDelete);
      deleteDependentButton.classList.toggle("hover:bg-red-100", canDelete);
      deleteDependentButton.classList.toggle("hover:border-red-300", canDelete);
      deleteDependentButton.classList.toggle("hover:text-red-600", canDelete);
    }

    function resetDependentForm() {
      selectedDependentId = null;
      dependentFormTitle.textContent = "부양가족 추가";
      dependentNameInput.value = "";
      dependentRelationInput.value = "CHILD";
      dependentBirthDateInput.value = "";
      dependentIncomeInput.value = "0";
      dependentResidentTypeInput.value = "RESIDENT";
      dependentLivesTogetherInput.checked = true;
      dependentDisabledInput.checked = false;
      dependentBasicDeductionInput.checked = true;
      updateDeleteButtonState(false);
    }

    function fillDependentForm(dependent) {
      selectedDependentId = dependent.id;
      dependentFormTitle.textContent = "부양가족 수정";
      dependentNameInput.value = dependent.name || "";
      dependentRelationInput.value = dependent.relationType || "CHILD";
      dependentBirthDateInput.value = dependent.birthDate || "";
      dependentIncomeInput.value = dependent.annualIncomeAmount || 0;
      dependentResidentTypeInput.value = dependent.residentType || "RESIDENT";
      dependentLivesTogetherInput.checked = !!dependent.livesTogether;
      dependentDisabledInput.checked = !!dependent.disabled;
      dependentBasicDeductionInput.checked = !!dependent.basicDeductionTarget;
      updateDeleteButtonState(true);
    }

    function buildDependentPayload() {
      return {
        name: dependentNameInput.value.trim(),
        relationType: dependentRelationInput.value,
        birthDate: dependentBirthDateInput.value,
        annualIncomeAmount: Number(dependentIncomeInput.value || 0),
        residentType: dependentResidentTypeInput.value,
        livesTogether: dependentLivesTogetherInput.checked,
        disabled: dependentDisabledInput.checked,
        basicDeductionTarget: dependentBasicDeductionInput.checked
      };
    }

    function renderDependents() {
      dependentCount.textContent = "총 " + dependents.length + "명";

      if (dependents.length === 0) {
        dependentList.innerHTML = '<div class="p-6 text-sm text-slate-500">등록된 부양가족이 없습니다. 없으면 빈 상태로 그대로 확정해도 됩니다.</div>';
        return;
      }

      const relationLabels = {
        SELF: "본인",
        SPOUSE: "배우자",
        CHILD: "자녀",
        PARENT: "부모"
      };

      dependentList.innerHTML = dependents.map(function (dependent) {
        const active = dependent.id === selectedDependentId;
        const relationLabel = relationLabels[dependent.relationType] || dependent.relationType;
        const badgeClasses = dependent.basicDeductionTarget ? "bg-green-100 text-green-700" : "bg-amber-100 text-amber-700";

        return `
          <button class="${active ? "w-full border-l-4 border-primary bg-primary/5 p-4 text-left transition-colors" : "w-full p-4 text-left transition-colors hover:bg-slate-50"}" data-dependent-id="${dependent.id}" type="button">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-100 font-bold text-blue-600">${dependent.name.slice(0, 2).toUpperCase()}</div>
                <div>
                  <p class="text-sm font-semibold text-slate-900">${dependent.name}</p>
                  <p class="text-xs text-slate-500">${relationLabel} · ${dependent.birthDate || "생년월일 미입력"}</p>
                </div>
              </div>
              <span class="rounded px-2 py-1 text-[10px] font-bold uppercase tracking-wider ${badgeClasses}">
                ${dependent.basicDeductionTarget ? "공제 대상" : "확인 필요"}
              </span>
            </div>
          </button>
        `;
      }).join("");

      dependentList.querySelectorAll("[data-dependent-id]").forEach(function (button) {
        button.addEventListener("click", function () {
          const dependent = dependents.find(function (item) {
            return item.id === button.dataset.dependentId;
          });
          if (dependent) {
            fillDependentForm(dependent);
            renderDependents();
          }
        });
      });
    }

    async function syncStepConfirmation(confirmed) {
      const basicInfo = window.YearEndApp.parseBasicInfo(currentSession);
      const updatedSession = await window.YearEndApp.updateBasicInfo(currentSessionId, {
        basicInfoJsonb: JSON.stringify({
          ...basicInfo,
          dependentsConfirmed: confirmed
        }),
        memo: currentSession && currentSession.memo ? currentSession.memo : ""
      });

      currentSession = updatedSession;
      window.YearEndApp.saveCurrentSession(updatedSession);
      updateStepStatus();
      return updatedSession;
    }

    async function refreshDependents() {
      dependents = await window.YearEndApp.listDependents(currentSessionId);
      if (selectedDependentId) {
        const selected = dependents.find(function (item) {
          return item.id === selectedDependentId;
        });
        if (selected) {
          fillDependentForm(selected);
        } else {
          resetDependentForm();
        }
      }
      renderDependents();
      updateStepStatus();
    }

    dependentForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (isStepConfirmed()) {
        return;
      }

      try {
        if (selectedDependentId) {
          await window.YearEndApp.updateDependent(currentSessionId, selectedDependentId, buildDependentPayload());
          showDependentMessage("success", "부양가족 정보를 수정했습니다.");
        } else {
          await window.YearEndApp.createDependent(currentSessionId, buildDependentPayload());
          showDependentMessage("success", "부양가족을 등록했습니다.");
        }

        await syncStepConfirmation(false);
        await refreshDependents();
      } catch (error) {
        showDependentMessage("error", error.message || "부양가족 저장에 실패했습니다.");
      }
    });

    deleteDependentButton.addEventListener("click", async function () {
      if (!selectedDependentId || isStepConfirmed()) {
        return;
      }

      try {
        await window.YearEndApp.deleteDependent(currentSessionId, selectedDependentId);
        await syncStepConfirmation(false);
        showDependentMessage("success", "부양가족을 삭제했습니다.");
        resetDependentForm();
        await refreshDependents();
      } catch (error) {
        showDependentMessage("error", error.message || "부양가족 삭제에 실패했습니다.");
      }
    });

    newDependentButton.addEventListener("click", function () {
      if (isStepConfirmed()) {
        return;
      }
      resetDependentForm();
      dependentNameInput.focus();
    });

    resetDependentButton.addEventListener("click", function () {
      window.location.href = "/index.html";
    });

    confirmStepButton.addEventListener("click", async function () {
      try {
        if (isStepConfirmed()) {
          await syncStepConfirmation(false);
          showDependentMessage("success", "1단계 확정을 풀었습니다. 이제 바로 수정할 수 있습니다.");
          return;
        }

        await syncStepConfirmation(true);
        showDependentMessage("success", "기본정보와 부양정보 입력 1단계를 완료로 확정했습니다.");
        window.setTimeout(function () {
          window.location.href = "/index.html";
        }, 500);
      } catch (error) {
        showDependentMessage("error", error.message || "1단계 확정 처리에 실패했습니다.");
      }
    });

    (async function bootstrapDependents() {
      if (!window.YearEndApp.requireAuthOrRedirect()) {
        return;
      }

      try {
        const context = await window.YearEndApp.initializeAuthenticatedContext();
        currentSessionId = context.currentSession.id;
        currentSession = context.currentSession;
        const displayName = (context.user.nickname || context.user.name || "사용자") + "님";
        pageUserName.textContent = displayName;
        pageAvatar.textContent = displayName.slice(0, 2).toUpperCase();
        updateStepStatus();
        resetDependentForm();
        await refreshDependents();
      } catch (error) {
        window.YearEndApp.clearAuth();
        window.location.replace("/auth.html");
      }
    })();
  </script>
</body>
</html>
