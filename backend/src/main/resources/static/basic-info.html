<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>기본정보 입력</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4b91e2",
            "background-light": "#f6f7f8"
          },
          fontFamily: {
            display: ["Inter", "Noto Sans KR", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-background-light font-display text-slate-900">
  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <a class="flex items-center gap-3 text-primary" href="/index.html">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary/10">
          <span class="material-symbols-outlined">account_balance</span>
        </div>
        <span class="text-xl font-bold tracking-tight text-slate-900">Easy-Tax</span>
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 gap-8 lg:grid-cols-12">
      <aside class="lg:col-span-4">
        <div class="sticky top-24 space-y-6">
          <div class="rounded-[28px] border border-slate-200 bg-white p-6 shadow-sm">
            <div class="mb-7 flex items-center gap-4">
              <div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary text-lg font-bold text-white" id="basic-page-avatar">YL</div>
              <div>
                <h2 class="text-lg font-bold leading-tight text-slate-900" id="basic-page-user-name">사용자님</h2>
                <p class="mt-1 text-sm font-medium text-slate-500" id="basic-page-status">1단계 진행 중</p>
              </div>
            </div>

            <nav class="space-y-2">
              <a class="flex items-center gap-3 rounded-xl bg-primary/10 px-4 py-3 text-primary transition-colors hover:bg-primary/10" href="/basic-info.html">
                <span class="material-symbols-outlined text-[1.9rem]">person</span>
                <span class="text-sm font-semibold">기본정보</span>
              </a>
              <a class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 transition-colors hover:bg-slate-50" href="/dependents.html">
                <span class="material-symbols-outlined text-[1.9rem]">group</span>
                <span class="text-sm font-semibold">부양정보</span>
              </a>
            </nav>
          </div>

          <div class="rounded-2xl border border-primary/20 bg-primary/5 p-5">
            <h3 class="text-sm font-bold text-primary">안내</h3>
            <p class="mt-2 text-sm leading-6 text-slate-600">
              기본정보를 저장한 뒤 다음 단계로 이동하면 부양가족 입력 화면으로 이어집니다.
              1단계 완료는 부양가족 화면에서 최종 확정 버튼을 눌러야 반영됩니다.
            </p>
          </div>
        </div>
      </aside>

      <section class="lg:col-span-8">
        <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
          <div class="border-b border-slate-200 px-6 py-6">
            <a class="mb-4 inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-600 transition-all hover:border-slate-300 hover:bg-slate-50 hover:text-slate-900" href="/index.html">
              <span class="material-symbols-outlined text-base">arrow_back</span>
              대시보드로 돌아가기
            </a>
            <h1 class="text-2xl font-bold text-slate-900">기본정보 입력</h1>
            <p class="mt-2 text-sm text-slate-500">
              연말정산 1단계의 첫 화면입니다. 기본정보를 저장한 뒤 부양가족 입력 단계로 이동합니다.
            </p>
          </div>

          <div class="mx-6 mt-6 hidden rounded-lg border px-4 py-3 text-sm" id="basic-info-message"></div>

          <form class="space-y-8 px-6 py-6" id="basic-info-form">
            <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-slate-700" for="full_name">이름</label>
                <input class="block w-full rounded-lg border-slate-300 focus:border-primary focus:ring-primary sm:text-sm" id="full_name" type="text">
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-slate-700" for="ssn">주민등록번호(SSN)</label>
                <input class="block w-full rounded-lg border-slate-300 focus:border-primary focus:ring-primary sm:text-sm" id="ssn" placeholder="XXX-XX-XXXX" type="password">
              </div>
              <div class="space-y-2 md:col-span-2">
                <label class="block text-sm font-medium text-slate-700" for="address">주소</label>
                <input class="block w-full rounded-lg border-slate-300 focus:border-primary focus:ring-primary sm:text-sm" id="address" type="text">
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-slate-700" for="city">도시</label>
                <input class="block w-full rounded-lg border-slate-300 focus:border-primary focus:ring-primary sm:text-sm" id="city" type="text">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                  <label class="block text-sm font-medium text-slate-700" for="state">주/도</label>
                  <select class="block w-full rounded-lg border-slate-300 focus:border-primary focus:ring-primary sm:text-sm" id="state">
                    <option value="서울특별시">서울특별시</option>
                    <option value="경기도">경기도</option>
                    <option value="California">California</option>
                    <option value="New York">New York</option>
                  </select>
                </div>
                <div class="space-y-2">
                  <label class="block text-sm font-medium text-slate-700" for="zip">우편번호</label>
                  <input class="block w-full rounded-lg border-slate-300 focus:border-primary focus:ring-primary sm:text-sm" id="zip" type="text">
                </div>
              </div>
            </div>

            <hr class="border-slate-200">

            <div class="space-y-4">
              <h2 class="text-lg font-semibold text-slate-900">신고 유형</h2>
              <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                <label class="relative flex cursor-pointer rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-all has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary">
                  <input checked class="sr-only" name="reporting_type" type="radio" value="SALARY_WORKER">
                  <div>
                    <span class="block text-sm font-bold text-slate-900">근로소득 중심</span>
                    <span class="mt-1 block text-xs text-slate-500">급여를 기준으로 기본 흐름을 진행합니다.</span>
                  </div>
                </label>
                <label class="relative flex cursor-pointer rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-all has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary">
                  <input class="sr-only" name="reporting_type" type="radio" value="YEAR_END_ADJUSTMENT">
                  <div>
                    <span class="block text-sm font-bold text-slate-900">연말정산 조정</span>
                    <span class="mt-1 block text-xs text-slate-500">간소화 자료와 연결해 화면 흐름을 확인합니다.</span>
                  </div>
                </label>
              </div>
            </div>

            <hr class="border-slate-200">

            <div class="space-y-2">
              <label class="block text-sm font-medium text-slate-700" for="notes">메모</label>
              <textarea class="block w-full rounded-lg border-slate-300 focus:border-primary focus:ring-primary sm:text-sm" id="notes" rows="4"></textarea>
            </div>

            <div class="flex items-center justify-between border-t border-slate-200 pt-6">
              <button class="rounded-xl border border-slate-200 bg-white px-6 py-2.5 text-sm font-semibold text-slate-600 transition-all hover:border-slate-300 hover:bg-slate-50 hover:text-slate-900" id="basic-info-cancel" type="button">취소</button>
              <div class="flex gap-4">
                <button class="rounded-xl border border-slate-200 bg-white px-6 py-2.5 text-sm font-semibold text-slate-700 transition-all hover:border-slate-300 hover:bg-slate-50" id="basic-info-save" type="button">저장</button>
                <button class="rounded-xl bg-primary px-8 py-2.5 text-sm font-semibold text-white shadow-md shadow-primary/20 transition-all hover:bg-primary/90" id="basic-info-next" type="submit">다음 단계</button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const basicInfoForm = document.getElementById("basic-info-form");
    const basicInfoMessage = document.getElementById("basic-info-message");
    const saveButton = document.getElementById("basic-info-save");
    const cancelButton = document.getElementById("basic-info-cancel");
    const basicPageAvatar = document.getElementById("basic-page-avatar");
    const basicPageUserName = document.getElementById("basic-page-user-name");
    const basicPageStatus = document.getElementById("basic-page-status");
    let currentSession = null;

    function showBasicInfoMessage(type, message) {
      basicInfoMessage.className = "mx-6 mt-6 rounded-lg border px-4 py-3 text-sm";
      basicInfoMessage.classList.add(
        type === "success" ? "border-emerald-200" : "border-red-200",
        type === "success" ? "bg-emerald-50" : "bg-red-50",
        type === "success" ? "text-emerald-700" : "text-red-700"
      );
      basicInfoMessage.textContent = message;
      basicInfoMessage.classList.remove("hidden");
    }

    function fillBasicInfoForm(session) {
      const basicInfo = window.YearEndApp.parseBasicInfo(session);
      document.getElementById("full_name").value = basicInfo.fullName || "";
      document.getElementById("ssn").value = basicInfo.ssnMasked || "";
      document.getElementById("address").value = basicInfo.address || "";
      document.getElementById("city").value = basicInfo.city || "";
      document.getElementById("state").value = basicInfo.state || "서울특별시";
      document.getElementById("zip").value = basicInfo.zip || "";
      document.getElementById("notes").value = session.memo || "";

      const reportingType = basicInfo.reportingType || session.filingType || "SALARY_WORKER";
      const radio = document.querySelector('input[name="reporting_type"][value="' + reportingType + '"]');
      if (radio) {
        radio.checked = true;
      }
    }

    function buildBasicInfoPayload() {
      const reportingType = document.querySelector('input[name="reporting_type"]:checked')?.value || "SALARY_WORKER";
      const previousBasicInfo = window.YearEndApp.parseBasicInfo(currentSession);

      return {
        basicInfoJsonb: JSON.stringify({
          ...previousBasicInfo,
          fullName: document.getElementById("full_name").value.trim(),
          ssnMasked: window.YearEndApp.maskSsn(document.getElementById("ssn").value),
          address: document.getElementById("address").value.trim(),
          city: document.getElementById("city").value.trim(),
          state: document.getElementById("state").value,
          zip: document.getElementById("zip").value.trim(),
          reportingType: reportingType,
          dependentsConfirmed: false
        }),
        memo: document.getElementById("notes").value.trim()
      };
    }

    function updatePageIdentity(user, session) {
      const name = (user && (user.nickname || user.name)) ? (user.nickname || user.name) : "사용자";
      const displayName = name + "님";
      basicPageUserName.textContent = displayName;
      basicPageStatus.textContent = window.YearEndApp.hasDependentsConfirmed(session) ? "1단계 완료" : "1단계 진행 중";
      basicPageAvatar.textContent = displayName.slice(0, 2).toUpperCase();
    }

    async function saveBasicInfo(redirectNext) {
      const sessionId = window.YearEndApp.getCurrentSessionId();
      if (!sessionId) {
        showBasicInfoMessage("error", "현재 작업 세션이 없습니다. 다시 로그인해 주세요.");
        return;
      }

      try {
        const updatedSession = await window.YearEndApp.updateBasicInfo(sessionId, buildBasicInfoPayload());
        currentSession = updatedSession;
        window.YearEndApp.saveCurrentSession(updatedSession);
        showBasicInfoMessage(
          "success",
          redirectNext
            ? "기본정보를 저장했습니다. 부양가족 입력 화면으로 이동합니다."
            : "기본정보를 저장했습니다."
        );

        if (redirectNext) {
          window.setTimeout(function () {
            window.location.href = "/dependents.html";
          }, 400);
        }
      } catch (error) {
        showBasicInfoMessage("error", error.message || "기본정보 저장에 실패했습니다.");
      }
    }

    basicInfoForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      await saveBasicInfo(true);
    });

    saveButton.addEventListener("click", async function () {
      await saveBasicInfo(false);
    });

    cancelButton.addEventListener("click", function () {
      window.location.href = "/index.html";
    });

    (async function bootstrapBasicInfo() {
      if (!window.YearEndApp.requireAuthOrRedirect()) {
        return;
      }

      try {
        const context = await window.YearEndApp.initializeAuthenticatedContext();
        currentSession = context.currentSession;
        updatePageIdentity(context.user, context.currentSession);
        fillBasicInfoForm(context.currentSession);
      } catch (error) {
        window.YearEndApp.clearAuth();
        window.location.replace("/auth.html");
      }
    })();
  </script>
</body>
</html>
