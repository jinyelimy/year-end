spring:
  application:
    name: year-end-settlement-simulator
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yearend}
    username: ${DB_USERNAME:yearend}
    password: ${DB_PASSWORD:yearend}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: info
    org.springframework.security: info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    jwt:
      issuer: year-end-settlement
      secret: ${JWT_SECRET:change-me-to-a-very-long-development-secret-key-1234567890}
      access-token-expiration-seconds: 3600
      refresh-token-expiration-seconds: 1209600
