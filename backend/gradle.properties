# Fix JDK 21 Unix Domain Socket path-length failure on Windows.
# The default java.io.tmpdir (C:\Users\<long-name>\AppData\Local\Temp\) exceeds
# the AF_UNIX socket path limit, causing "Unable to establish loopback connection"
# in Gradle's NIO PipeImpl. A short tmpdir path resolves this.
org.gradle.jvmargs=-Xmx512m -Djdk.net.unixdomain.tmpdir=C:/Temp
